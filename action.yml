name: EnvSure
description: Fail PRs that use environment variables (env vars) or secrets missing in Vercel, AWS, Render, GitHub & more. Names only.
author: sekharsdet
branding:
  icon: shield
  color: green
inputs:
  token:
    description: >
      Token that can read GitHub secret and variable names (GitHub App installation token or
      fine-grained PAT with Secrets, Variables, Environments and Actions read; the default
      GITHUB_TOKEN cannot list secrets). Only needed when GitHub is checked: for workflow
      references and environments without platform sources. Platform sources (Vercel, Render,
      AWS, ...) read their own credentials from the step's `env:`.
    required: false
  comment-token:
    description: Token used to comment on the PR (needs pull-requests write).
    required: false
    default: ${{ github.token }}
  config:
    description: >
      Path to the config file (default .github/envsure.yml; optional when that file is absent).
      On pull requests it is read from the base commit, so a PR cannot change its own check.
    required: false
  fail-on-missing:
    description: Fail the check when variables are missing.
    required: false
    default: "true"
  comment-on-success:
    description: Also comment when nothing is missing.
    required: false
    default: "false"
  report-unused:
    description: Also list configured names that appear nowhere in the repository (informational).
    required: false
    default: "false"
  fail-on-unused:
    description: Report unused names and fail the check when any are found.
    required: false
    default: "false"
outputs:
  missing:
    description: Number of referenced variables missing somewhere.
  dotenv-issues:
    description: Number of empty or placeholder values in committed .env files.
  unused:
    description: Number of possibly unused configured names (0 unless report-unused or fail-on-unused).
runs:
  using: node24
  main: dist/action.js
